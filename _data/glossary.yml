# AI Reference 용어 사전 (Glossary) 데이터

- id: agentic-workflow
  term: Agentic Workflow
  korean: 에이전틱 워크플로우
  category: agent
  category_name: 에이전트 & 워크플로우
  summary: AI가 단순 텍스트 생성을 넘어 '계획 → 도구 실행 → 관찰 → 자가 수정' 루프를 돌며 자율적으로 작업을 완수하는 작업 방식
  description: |
    기존 챗봇의 단방향 프롬프트-응답(Zero-shot)과 달리, AI 에이전트가 목표(Goal)를 달성할 때까지 스스로 하위 작업을 쪼개고(Decomposition), 터미널/브라우저/파일 등 외부 도구를 호출(Tool Calling)하며, 발생한 에러를 관찰(Observation)하여 교정하는 반복 루프 구조를 의미합니다.
  tags: [Agent, Workflow, Autonomous, Tool Use]
  references:
    - title: "루프 엔지니어링 가이드"
      url: "/ai-reference/onboarding/loop-engineering/"

- id: reasoning-models
  term: Reasoning Models & Test-Time Compute
  korean: 추론 모델 & 추론 시점 연산
  category: model
  category_name: 모델 & 추론
  summary: 질문을 받자마자 바로 답을 출력하는 대신, 모델 내부에서 체계적인 사고(Chain-of-Thought)를 거친 후 답변하는 모델
  description: |
    OpenAI의 o1/o3, DeepSeek R1, Claude Thinking, Gemini Flash Thinking처럼 추론 시점에 추가 연산량(Test-Time Compute)을 투입하여 단계별로 검증하며 해답을 찾아가는 모델입니다. 복잡한 알고리즘, 수학, 대규모 리팩토링 및 엣지 케이스 분석에서 뛰어난 성능을 발휘합니다.
  tags: [Reasoning, CoT, DeepSeek, o1, Claude Thinking]
  references:
    - title: "클라우드 LLM 최신 동향"
      url: "/ai-reference/cloud-llm/cloud-llms-overview/"

- id: mcp
  term: MCP (Model Context Protocol)
  korean: 모델 컨텍스트 프로토콜
  category: tools
  category_name: 도구 & 프로토콜
  summary: LLM과 로컬/원격 데이터 소스(파일, DB, API, 도구) 간의 안전하고 표준화된 연결을 제공하는 오픈 프로토콜
  description: |
    Anthropic이 제안하고 업계 표준으로 자리잡은 오픈 규약입니다. 서비스 제공자마다 개별 플러그인을 만들 필요 없이, MCP 서버를 한 번 구현하면 Claude Code, Cursor, Antigravity 등 다양한 AI 클라이언트에서 일관되게 도구와 데이터소스를 사용할 수 있습니다.
  tags: [MCP, Standards, Integration, Anthropic]
  references:
    - title: "MCP: AI 툴링의 미래"
      url: "/ai-reference/skills-mcp/mcp-the-future-of-ai-tooling/"
    - title: "Python으로 MCP 서버 구축하기"
      url: "/ai-reference/skills-mcp/build-mcp-server-python/"

- id: context-engineering
  term: Context Engineering
  korean: 컨텍스트 엔지니어링
  category: prompt
  category_name: 컨텍스트 & 프롬프트
  summary: AI의 컨텍스트 윈도우 안에 가장 관련성 높고 압축된 정보(규칙, 파일, 지식)를 전략적으로 배치하는 기술
  description: |
    단순한 문장 작성(Prompt Engineering)을 넘어, 프로젝트 구조(AGENTS.md, CLAUDE.md), 스킬(Skills), 도구 정의, 최근 대화 이력, RAG 검색 결과 등 제한된 컨텍스트 공간 내에 노이즈를 줄이고 최적의 정보를 주입하는 상위 개념의 엔지니어링입니다.
  tags: [Context, Token, AGENTS.md, Optimization]
  references:
    - title: "컨텍스트 엔지니어링 가이드"
      url: "/ai-reference/prompt-engineering/context-engineering/"

- id: harness-engineering
  term: Harness Engineering
  korean: 하네스 엔지니어링
  category: engineering
  category_name: 엔지니어링 & 검증
  summary: AI 에이전트가 탈선하지 않고 안정적으로 코드를 작성할 수 있도록 환경(테스트, 린터, 샌드박스, 검증기)을 구축하는 것
  description: |
    마치 자동차의 안전벨트(Harness)처럼, AI 에이전트가 코드를 수정할 때 컴파일러, 타입 검사기(TypeScript/mypy), 단위 테스트(Jest/pytest), 린터(ESLint) 등의 즉각적인 피드백을 주어 에러를 자가 교정할 수 있게 지원하는 인프라 구축 기법입니다.
  tags: [Harness, Testing, Quality, Verification]
  references:
    - title: "하네스 엔지니어링 실무"
      url: "/ai-reference/onboarding/harness-engineering/"
    - title: "AI 생성 코드 검증 가이드"
      url: "/ai-reference/onboarding/verify-ai-generated-code/"

- id: vibe-coding
  term: Vibe Coding
  korean: 바이브 코딩
  category: agent
  category_name: 에이전트 & 워크플로우
  summary: 개발자가 모든 코드를 직접 작성하는 대신, 자연어로 느낌과 방향성(Vibe)을 지시하고 AI 에이전트가 전체 코드를 빌드하는 개발 방식
  description: |
    Andrej Karpathy가 제안한 개념으로, 자연어로 의도를 전달하고 AI가 파일 생성, 패키지 설치, UI 빌드, 디버깅을 도맡아 빠르게 프로토타입을 완성하는 방식을 뜻합니다. 실무에서는 TDD 및 아키텍처 제약과 결합하여 안전성을 확보합니다.
  tags: [Vibe Coding, Karpathy, Rapid Prototyping]
  references: []

- id: loop-engineering
  term: Loop Engineering
  korean: 루프 엔지니어링
  category: engineering
  category_name: 엔지니어링 & 검증
  summary: 에이전트의 실행 루프(Plan → Act → Observe)가 무한 루프에 빠지거나 헛돌지 않도록 정지 조건과 피드백 메커니즘을 설계하는 기술
  description: |
    자율 에이전트가 작업을 수행할 때 발생하는 실패 패턴을 방지하기 위해 최대 반복 횟수 설정, 상태 추적, 사용자 피드백 인터럽트, 단계별 체크포인트 등을 설계하여 신뢰성을 확보하는 엔지니어링입니다.
  tags: [Loop, Feedback, Reliability, Architecture]
  references:
    - title: "루프 엔지니어링 상세 분석"
      url: "/ai-reference/onboarding/loop-engineering/"

- id: rag
  term: RAG (Retrieval-Augmented Generation)
  korean: 검색 증강 생성
  category: model
  category_name: 모델 & 추론
  summary: LLM이 사전에 학습하지 않은 최신 데이터나 비공개 사내 문서를 외부 벡터 DB 등에서 검색하여 프롬프트에 주입하는 방식
  description: |
    모델을 재학습(Fine-tuning)하지 않고도 최신 지식이나 대규모 사내 문서 저장소에서 질문과 가장 유사한 청크(Chunk)를 찾아와 정확한 근거 기반의 답변을 유도하는 기법입니다.
  tags: [RAG, Vector DB, Embeddings, Search]
  references: []

- id: large-context
  term: Large Context Window
  korean: 대규모 컨텍스트 윈도우
  category: model
  category_name: 모델 & 추론
  summary: 100만~200만 토큰 이상의 방대한 양의 텍스트와 코드베이스를 한 번에 입력받아 처리할 수 있는 LLM의 수용 용량
  description: |
    Gemini 1.5/2.0 Pro, Claude 3.5 Sonnet 등 수백만 토큰을 수용하는 모델들의 등장으로 전체 저장소(Repository) 코드나 수천 페이지의 문서를 통째로 읽고 cross-file 추론을 수행할 수 있게 되었습니다.
  tags: [Context Window, Long Context, Gemini, Claude]
  references: []

- id: agents-md
  term: AGENTS.md / CLAUDE.md / Rules
  korean: 에이전트 규칙 파일
  category: prompt
  category_name: 컨텍스트 & 프롬프트
  summary: 저장소 루트에 위치하여 AI 에이전트에게 프로젝트 컨벤션, 빌드/테스트 명령, 아키텍처 가이드라인을 주입하는 표준 마크다운 파일
  description: |
    개발자가 매번 프롬프트에 프로젝트 규칙을 적지 않아도, 에이전트가 작업을 시작할 때 자동으로 읽어들여 일관된 코딩 스타일과 워크플로우를 준수하게 만드는 프로젝트 레벨 설정 파일입니다.
  tags: [AGENTS.md, CLAUDE.md, Rules, Guidelines]
  references:
    - title: "AGENTS.md 크로스 툴 표준"
      url: "/ai-reference/onboarding/agents-md-cross-tool-standard/"
    - title: "CLAUDE.md 모범 사례"
      url: "/ai-reference/onboarding/claude-md-best-practices/"

- id: local-llm
  term: Local LLM & Small Language Models (SLMs)
  korean: 로컬 LLM & 소형 특화 모델
  category: tools
  category_name: 도구 & 프로토콜
  summary: 클라우드 API를 통하지 않고 개인 PC나 사내 온프레미스 서버에서 Ollama, LM Studio 등을 통해 독립적으로 구동하는 모델
  description: |
    Qwen 2.5 Coder, Llama 3.3, Gemma 2 등 소형화되면서도 뛰어난 코딩/추론 능력을 갖춘 오픈 가중치 모델들입니다. 사내 데이터 보안, 오프라인 환경, 비용 절감 목적에 매우 유용합니다.
  tags: [Ollama, LM Studio, Qwen, Local AI, Privacy]
  references:
    - title: "Ollama 로컬 LLM 가이드"
      url: "/ai-reference/local-llm/local-llm-ollama-guide/"
    - title: "LM Studio 가이드"
      url: "/ai-reference/local-llm/lm-studio-guide/"

- id: skills-subagents
  term: Skills & Subagents
  korean: 스킬 & 서브에이전트
  category: agent
  category_name: 에이전트 & 워크플로우
  summary: 특정 전문 영역(DB 마이그레이션, 브라우저 테스트, 코드 리뷰 등)에 특화된 지침 묶음(Skill)과 이를 독립 실행하는 하위 에이전트(Subagent)
  description: |
    메인 에이전트의 컨텍스트 오염을 막고 전문성을 높이기 위해, 특정 작업에 대한 전문 프롬프트와 도구를 가진 하위 에이전트(Subagent)를 스폰(Spawn)하여 병렬 또는 위임 처리하는 최신 아키텍처 패턴입니다.
  tags: [Skills, Subagents, Architecture, Antigravity]
  references:
    - title: "Claude 스킬 & 서브에이전트 명령어"
      url: "/ai-reference/skills-mcp/claude-skill-subagent-command/"
